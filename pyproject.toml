[project]
name = "macrosope"
version = "0.1.0"
description = "宏观数据工作台 —— 本地经济数据导入、处理、分析与制图"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "plotly>=6.1.1",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "scipy>=1.13",
    "kaleido>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macrosope*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["macrosope", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length — 交给 formatter，不强断
    "B008",  # 函数参数默认值里的函数调用（Streamlit 常用 st.file_uploader 无此问题，保留宽松）
]

[tool.ruff.lint.per-file-ignores]
"macrosope/pages/*.py" = ["F401"]  # Streamlit 页面里的导入用于 exec 侧写，保留

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp 指向项目内目录，规避 Windows AppData\Local\Temp 下 pytest-of-* 的 ACL 权限问题
addopts = "-q --basetemp=data/.pytest-tmp"
