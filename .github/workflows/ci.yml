name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check macrosope app.py pages tests demo sample_data scripts
      - name: Test
        run: python -m pytest
      - name: Prepare Chrome for image exports
        run: python -c "import kaleido; kaleido.get_chrome_sync()"
      - name: End-to-end demo with synthetic data
        run: python demo/run_demo.py
      - name: Check and build public source archive
        run: python scripts/prepare_release.py
